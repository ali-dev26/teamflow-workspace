name: TeamFlow Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t teamflow-workspace .

      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name teamflow-api teamflow-workspace

      - name: Test API endpoints
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/projects
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/members
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/reports

      - name: Show container logs on failure
        if: failure()
        run: docker logs teamflow-api

      - name: Stop container
        if: always()
        run: docker stop teamflow-api || true
